name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (e.g. v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  check-ref:
    runs-on: ubuntu-24.04
    steps:
      - name: Require dispatch on the release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_REF_TYPE" != tag || "$GITHUB_REF_NAME" != "$RELEASE_TAG" ]]; then
            echo 'Dispatch this workflow on the release tag, with the same tag input.' >&2
            exit 1
          fi

  checks:
    needs: check-ref
    uses: ./.github/workflows/checks.yml

  publish:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Validate release version
        id: version
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { appendFileSync, readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.equal(pkg.name, 'paseo-jj-companion');
          assert.notEqual(pkg.private, true, 'The package must be publishable');
          assert.match(pkg.version, /^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/);
          assert.equal(process.env.RELEASE_TAG, `v${pkg.version}`, 'Tag must match package.json');
          const prerelease = pkg.version.includes('-');
          appendFileSync(process.env.GITHUB_OUTPUT, `dist-tag=${prerelease ? 'next' : 'latest'}\n`);
          NODE

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      # Paseo compiles the shipped TypeScript after running the manifest's build command.
      - name: Pack and check the release artifact
        id: pack
        run: |
          npm pack --json --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/pack.json"
          node tools/check-package.mjs "$RUNNER_TEMP/pack.json"

      - name: Publish with npm trusted publishing
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          DIST_TAG: ${{ steps.version.outputs.dist-tag }}
        run: npm publish "$TARBALL" --access public --tag "$DIST_TAG"
